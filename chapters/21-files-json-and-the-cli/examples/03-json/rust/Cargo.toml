[package]
name = "books"
version = "0.1.0"
edition = "2024"

# The checker runs the program as main.
[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
# serde turns Rust values into data and back; its derive feature writes the code for a
# struct. serde_json reads and writes that data as JSON.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
